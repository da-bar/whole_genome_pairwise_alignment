name: ucsc_chainprenet
description: Remove chains that have no chance of being netted (UCSC kent chainPreNet)
keywords:
  - chain
  - alignment
  - net
  - ucsc
  - ucsc/chainprenet
tools:
  - ucsc:
      description: |
        chainPreNet removes chains that don't have a chance of being netted,
        i.e. chains fully covered by higher-scoring chains on the target side.
        Input chains must be sorted by score (e.g. with chainMergeSort).
      homepage: http://hgdownload.cse.ucsc.edu/admin/exe/
      documentation: https://genome.ucsc.edu/goldenPath/help/chain.html
      tool_dev_url: https://github.com/ucscGenomeBrowser/kent/tree/master/src/hg/mouseStuff/chainPreNet
      licence: ["varies; see http://genome.ucsc.edu/license"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - chain:
        type: file
        description: Chain file sorted by score, optionally gzipped
        pattern: "*.{chain,chain.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3982 # CHAIN
    - target_sizes:
        type: file
        description: |
          Tab-separated sequence sizes of the target genome ("name<TAB>length"), optionally gzipped
        pattern: "*.{sizes,txt,tsv}{,.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - query_sizes:
        type: file
        description: |
          Tab-separated sequence sizes of the query genome ("name<TAB>length"), optionally gzipped
        pattern: "*.{sizes,txt,tsv}{,.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  chain:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.chain.gz":
          type: file
          description: Gzipped chain file with un-nettable chains removed
          pattern: "*.chain.gz"
          ontologies:
            - edam: http://edamontology.org/format_3982 # CHAIN
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_ucsc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@da-bar"
maintainers:
  - "@da-bar"
