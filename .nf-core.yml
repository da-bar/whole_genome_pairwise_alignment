repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wgpa_logo_light.png
    - docs/images/nf-core-wgpa_logo_light.png
    - docs/images/nf-core-wgpa_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wgpa_logo_light.png
    - docs/images/nf-core-wgpa_logo_light.png
    - docs/images/nf-core-wgpa_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: da-bar
  name: wgpa
  description: Whole-genome pairwise alignment, chaining, netting, liftOver chains
    and CNE calling
  author: Damir Baranasic
  version: 2.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - multiqc
    - gpu
    - codespaces
    - seqera_platform
  is_nfcore: false
